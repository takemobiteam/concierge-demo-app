<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Concierge Bridge Demo</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      margin: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: Helvetica, Arial, sans-serif;
      padding: 20px max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
      padding-top: max(24px, env(safe-area-inset-top));
    }

    h1 {
      font-size: clamp(18px, 5vw, 22px);
      margin-bottom: 4px;
    }

    p.sub {
      color: #8a8a90;
      font-size: 13px;
      margin-top: 0;
    }

    #locale-badge {
      display: inline-block;
      vertical-align: middle;
      margin-left: 8px;
      background: rgba(232, 181, 154, 0.12);
      border: 1px solid rgba(232, 181, 154, 0.7);
      color: #e8b59a;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
    }

    button {
      background: #e8b59a;
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 600;
      flex: 1 1 140px;
      min-height: 48px;
    }

    #auth-status {
      margin-top: 12px;
      background: #111114;
      border: 1px solid #24242a;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 14px;
    }

    #auth-status.warn {
      border-color: rgba(232, 181, 154, 0.7);
      color: #e8b59a;
    }

    #log {
      margin-top: 20px;
      background: #111114;
      border: 1px solid #24242a;
      border-radius: 12px;
      padding: 14px;
      font-family: monospace;
      font-size: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      max-width: 100%;
    }
  </style>
</head>

<body>
  <h1>Concierge Bridge Demo<span id="locale-badge">en-US</span></h1>
  <p class="sub">Local page standing in for the remote concierge site.</p>

  <div id="auth-status">Signed out</div>

  <p class="sub" style="margin-top: 12px;">Simulate a page → app message (OPEN_PAGE):</p>
  <div class="actions">
    <button onclick="sendOpenPage('home')">home</button>
    <button onclick="sendOpenPage('benefits')">benefits</button>
    <button onclick="sendOpenPage('membership')">membership</button>
    <button onclick="sendOpenPage('profile')">more</button>
  </div>

  <p class="sub" style="margin-top: 12px;">Request an auth code from the app again (sent automatically on load):</p>
  <div class="actions">
    <button onclick="requestAuth()">Send AUTH_REQUEST</button>
  </div>

  <p class="sub" style="margin-top: 12px;">Open an external URL in the system browser:</p>
  <div class="actions">
    <button onclick="sendOpenExternalUrl('https://example.com/terms')">Open example.com</button>
  </div>

  <div id="log">waiting…</div>

  <script>
    const logEl = document.getElementById('log');
    function log(line) {
      logEl.textContent += '\n' + line;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function postToNative(payload) {
      const message = JSON.stringify(payload);
      // iOS exposes window.webkit.messageHandlers.MobiBridge; the plugin
      // also aliases it as window.MobiBridge so this works on both platforms.
      if (window.MobiBridge && window.MobiBridge.postMessage) {
        window.MobiBridge.postMessage(message);
      } else if (window.webkit?.messageHandlers?.MobiBridge) {
        window.webkit.messageHandlers.MobiBridge.postMessage(message);
      } else {
        log('ERROR: MobiBridge channel not found');
        return;
      }
      log('-> sent ' + payload.type);
    }

    function sendOpenPage(page) {
      postToNative({ type: 'OPEN_PAGE', page });
    }

    function sendOpenExternalUrl(url) {
      postToNative({ type: 'OPEN_EXTERNAL_URL', url });
    }

    // Sign-in, mirroring the real concierge's /request-auth page: every load
    // starts signed out (this stand-in keeps its session in memory only) and
    // asks the app for a code. With no AUTH_CODE after 3 seconds it shows the
    // "reload the app" warning and never retries by itself; a late code still
    // signs in. LOGOUT signs out without asking for a new code — the app
    // reloads this page once a native user signs in again.
    const AUTH_REQUEST_TIMEOUT_MS = 3000;
    const statusEl = document.getElementById('auth-status');
    let awaitingCode = false;
    let authTimer = null;
    const usedCodes = new Set();

    function setStatus(text, warn) {
      statusEl.textContent = text;
      statusEl.classList.toggle('warn', !!warn);
    }

    function requestAuth() {
      awaitingCode = true;
      clearTimeout(authTimer);
      authTimer = setTimeout(() => {
        log('!! no AUTH_CODE within ' + AUTH_REQUEST_TIMEOUT_MS / 1000 + 's');
        setStatus('Couldn\'t sign you in. Please reload the app.', true);
      }, AUTH_REQUEST_TIMEOUT_MS);
      setStatus('Requesting an auth code…');
      postToNative({ type: 'AUTH_REQUEST' });
    }

    function receiveAuthCode(code) {
      clearTimeout(authTimer);
      // The real page doesn't guard against these; flag them here so the
      // app's promises are easy to check by hand.
      if (!awaitingCode) log('!! AUTH_CODE arrived without an AUTH_REQUEST');
      if (usedCodes.has(code)) {
        log('!! code was already used; a real single-use exchange would fail ' +
          '(fine for MOCK_AUTH user ids)');
      }
      awaitingCode = false;
      usedCodes.add(code);
      // Stands in for POST /api/auth/code-exchange.
      setStatus('Signed in with code ' + code);
    }

    function logout() {
      clearTimeout(authTimer);
      awaitingCode = false;
      setStatus('Signed out. Please reload the app.', true);
    }

    // App → page messages, delivered via window.postMessage. AUTH_CODE and
    // LOGOUT drive sign-in above, CHANGE_LOCALE updates the badge, and the
    // rest are just logged.
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      log('<- received: ' + JSON.stringify(data));
      if (data.type === 'CHANGE_LOCALE' && data.locale) {
        document.getElementById('locale-badge').textContent = data.locale;
      } else if (data.type === 'AUTH_CODE' && typeof data.code === 'string') {
        receiveAuthCode(data.code);
      } else if (data.type === 'LOGOUT') {
        logout();
      }
    });

    log('loaded — waiting for CHANGE_LOCALE / OPEN_CHIPS / OPEN_PROMPT / AUTH_CODE / LOGOUT');
    requestAuth();
  </script>
</body>

</html>
